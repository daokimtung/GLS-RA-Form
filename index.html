.gls-app {
  --dark-green: #195124;
  --mid-green: #52833C;
  --light-green: #88b84d;
  --light-green-bg: #EEF5E7;
  --amber: #C7A30A;
  --amber-bg: #FBF6DC;
  --accent: #52833C;
  --accent-bg: #EEF5E7;
  --paper: #FAF8F4;
  --ink: #1F2A24;
  --ink-soft: #55625B;
  --line: #DCE3DC;
  --white: #FFFFFF;
  --danger: #A6472A;

  font-family: 'IBM Plex Sans', -apple-system, sans-serif;
  color: var(--ink);
  background: var(--paper);
  min-height: 100%;
  line-height: 1.5;
  font-size: 15px;
}
.gls-app * { box-sizing: border-box; }
.gls-app h1, .gls-app h2, .gls-app h3 {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 600;
  color: var(--dark-green);
  margin: 0;
}
.gls-serif { font-family: 'Fraunces', Georgia, serif; }

/* ---------- Welcome screen ---------- */
.gls-welcome {
  max-width: 640px;
  margin: 0 auto;
  padding: 56px 24px 80px;
}
.gls-welcome-mark {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 40px;
}
.gls-welcome-mark .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.gls-welcome-mark span { letter-spacing: 0.02em; color: var(--ink-soft); font-size: 13px; }
.gls-welcome h1 { font-size: 34px; line-height: 1.15; margin-bottom: 18px; }
.gls-welcome p { color: var(--ink-soft); font-size: 15.5px; margin: 0 0 16px; max-width: 54ch; }
.gls-welcome-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  margin: 32px 0;
}
.gls-welcome-cell { background: var(--white); padding: 18px 16px; }
.gls-welcome-cell .num { font-family: 'Fraunces', serif; font-size: 22px; color: var(--dark-green); display: block; }
.gls-welcome-cell .lbl { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; display: block; }
.gls-welcome-note {
  border-left: 3px solid var(--accent);
  background: var(--accent-bg);
  padding: 14px 18px;
  font-size: 14px;
  color: var(--ink);
  margin: 24px 0 32px;
}
.gls-welcome-note strong { color: var(--dark-green); }
.gls-field-row { margin-bottom: 16px; }
.gls-field-row label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
.gls-field-row input {
  width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 3px;
  font-family: inherit; font-size: 14.5px; background: var(--white); color: var(--ink);
}
.gls-field-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }

.gls-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--dark-green); color: var(--white); border: none;
  padding: 13px 26px; font-size: 14.5px; font-weight: 500; border-radius: 3px;
  cursor: pointer; font-family: inherit;
}
.gls-btn:hover { background: var(--mid-green); }
.gls-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.gls-btn-ghost {
  background: transparent; color: var(--dark-green); border: 1px solid var(--line);
}
.gls-btn-ghost:hover { background: var(--light-green-bg); border-color: var(--mid-green); }
.gls-btn-text {
  background: none; border: none; color: var(--accent); font-family: inherit;
  font-size: 13.5px; cursor: pointer; padding: 4px 0; text-decoration: underline;
}

/* ---------- Survey shell ---------- */
.gls-shell { display: flex; min-height: 100vh; }
.gls-rail {
  width: 230px; flex-shrink: 0; background: var(--dark-green); color: var(--white);
  padding: 28px 20px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.gls-rail-brand { font-size: 12px; letter-spacing: 0.03em; color: var(--light-green); margin-bottom: 2px; }
.gls-rail-title { font-family: 'Fraunces', serif; font-size: 17px; margin-bottom: 28px; line-height: 1.3; }
.gls-rail-item {
  display: flex; align-items: flex-start; gap: 10px; padding: 9px 8px; border-radius: 3px;
  cursor: pointer; margin-bottom: 2px; font-size: 13.5px; color: rgba(255,255,255,0.75);
}
.gls-rail-item.active { background: rgba(255,255,255,0.12); color: var(--white); }
.gls-rail-item.done { color: var(--light-green); }
.gls-rail-item:hover { background: rgba(255,255,255,0.08); }
.gls-rail-letter {
  width: 20px; height: 20px; border-radius: 50%; border: 1px solid currentColor;
  display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0;
}
.gls-rail-item.active .gls-rail-letter { background: var(--light-green); border-color: var(--light-green); color: var(--dark-green); }
.gls-rail-progress { margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.15); }
.gls-rail-progress-bar { height: 4px; background: rgba(255,255,255,0.18); border-radius: 2px; overflow: hidden; }
.gls-rail-progress-fill { height: 100%; background: var(--light-green); }
.gls-rail-progress-text { font-size: 12px; color: rgba(255,255,255,0.65); margin-top: 8px; }

.gls-main { flex: 1; min-width: 0; }
.gls-topbar {
  display: none; background: var(--dark-green); color: var(--white); padding: 14px 18px;
  position: sticky; top: 0; z-index: 5;
}
.gls-topbar-title { font-family: 'Fraunces', serif; font-size: 15px; }
.gls-topbar-bar { height: 3px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.gls-topbar-fill { height: 100%; background: var(--light-green); }

.gls-content { max-width: 760px; margin: 0 auto; padding: 48px 32px 140px; }
.gls-section-tag { font-size: 12.5px; color: var(--accent); letter-spacing: 0.02em; margin-bottom: 6px; }
.gls-section-title { font-size: 27px; margin-bottom: 6px; }
.gls-section-desc { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 36px; max-width: 58ch; }
.gls-subsection-title {
  font-family: 'Fraunces', serif; font-size: 17px; color: var(--dark-green);
  margin: 40px 0 18px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.gls-subsection-title:first-of-type { margin-top: 0; }

/* ---------- Question blocks ---------- */
.gls-field { margin-bottom: 26px; }
.gls-field-label { display: block; font-size: 14.5px; font-weight: 500; color: var(--ink); margin-bottom: 4px; }
.gls-req { color: var(--danger); margin-left: 3px; }
.gls-field-sub { font-size: 13px; color: var(--ink-soft); margin: 0 0 10px; }
.gls-input, .gls-textarea, .gls-select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px;
  font-family: inherit; font-size: 14.5px; background: var(--white); color: var(--ink);
}
.gls-input:focus, .gls-textarea:focus, .gls-select:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg);
}
.gls-textarea { resize: vertical; min-height: 78px; }
.gls-missing .gls-input, .gls-missing .gls-textarea { border-color: var(--danger); }
.gls-missing-note { color: var(--danger); font-size: 12.5px; margin-top: 5px; }

.gls-options { display: flex; flex-direction: column; gap: 8px; }
.gls-option {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 3px; cursor: pointer; font-size: 14px;
}
.gls-option:hover { border-color: var(--mid-green); }
.gls-option.checked { border-color: var(--mid-green); background: var(--light-green-bg); }
.gls-option input { margin-top: 2px; accent-color: var(--dark-green); flex-shrink: 0; }
.gls-yesno { display: flex; gap: 10px; }
.gls-yesno button {
  flex: 1; padding: 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--white);
  font-family: inherit; font-size: 14px; cursor: pointer; color: var(--ink);
}
.gls-yesno button.checked { background: var(--dark-green); border-color: var(--dark-green); color: var(--white); }
.gls-other-input { margin-top: 8px; margin-left: 30px; }

.gls-subfields { display: flex; flex-wrap: wrap; gap: 14px; }
.gls-subfield { flex: 1 1 200px; }
.gls-subfield label { display: block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 5px; }

.gls-callout { border-left: 3px solid var(--amber); background: var(--amber-bg); padding: 16px 18px; margin-bottom: 26px; border-radius: 0 3px 3px 0; }
.gls-callout.info-only { border-left-color: var(--ink-soft); background: #F1F0EC; }
.gls-callout-tag { font-size: 11.5px; font-weight: 600; color: var(--amber); letter-spacing: 0.02em; margin-bottom: 6px; }
.gls-callout.info-only .gls-callout-tag { color: var(--ink-soft); }
.gls-callout-text { font-size: 13.5px; color: var(--ink); margin: 0 0 10px; }
.gls-callout .gls-textarea { background: var(--white); }

.gls-table-wrap { border: 1px solid var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
.gls-row-card { padding: 16px; background: var(--white); border-bottom: 1px solid var(--line); position: relative; }
.gls-row-card:last-child { border-bottom: none; }
.gls-row-card:nth-child(odd) { background: #FCFBF9; }
.gls-row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.gls-row-num { font-size: 12px; color: var(--accent); font-weight: 600; }
.gls-row-remove { background: none; border: none; color: var(--danger); font-size: 12.5px; cursor: pointer; font-family: inherit; }
.gls-row-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.gls-row-grid .gls-subfield input { padding: 8px 10px; font-size: 13.5px; }
.gls-add-row {
  background: var(--white); border: 1px dashed var(--mid-green); color: var(--mid-green);
  padding: 10px 16px; border-radius: 3px; font-family: inherit; font-size: 13.5px;
  cursor: pointer; width: 100%; text-align: center;
}
.gls-add-row:hover { background: var(--light-green-bg); }

.gls-footer-nav {
  position: sticky; bottom: 0; background: var(--white); border-top: 1px solid var(--line);
  padding: 16px 32px; display: flex; justify-content: space-between; align-items: center;
}
.gls-footer-nav-right { display: flex; align-items: center; gap: 14px; }
.gls-save-status { font-size: 12.5px; color: var(--ink-soft); }

.gls-complete { max-width: 560px; margin: 0 auto; padding: 90px 24px; text-align: center; }
.gls-complete h1 { font-size: 26px; margin-bottom: 14px; }
.gls-complete p { color: var(--ink-soft); margin-bottom: 8px; }

.gls-scale { display: flex; flex-direction: column; gap: 8px; }
.gls-scale-option {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 3px; cursor: pointer; font-size: 13.5px;
}
.gls-scale-option:hover { border-color: var(--mid-green); }
.gls-scale-option.checked { border-color: var(--mid-green); background: var(--light-green-bg); }
.gls-scale-option input { accent-color: var(--dark-green); flex-shrink: 0; }
.gls-scale-num {
  width: 22px; height: 22px; border-radius: 50%; background: var(--dark-green); color: var(--white);
  display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 600; flex-shrink: 0;
}
.gls-scale-lbl { color: var(--ink); }

.gls-matrix { display: flex; flex-direction: column; gap: 20px; }
.gls-matrix-row { border-left: 2px solid var(--accent); padding-left: 14px; }
.gls-matrix-row-label { font-size: 13.5px; font-weight: 500; color: var(--dark-green); margin-bottom: 8px; }
.gls-options-compact { gap: 6px; }
.gls-options-compact .gls-option { padding: 7px 10px; font-size: 13px; }

.gls-vi-line { display: block; font-style: italic; color: var(--ink-soft); font-weight: 400; margin-top: 2px; }
.gls-field-label .gls-vi-line { font-size: 0.88em; }
.gls-option .gls-vi-line, .gls-scale-option .gls-vi-line { font-size: 0.9em; margin-top: 1px; }
.gls-yesno button .gls-vi-line { font-size: 0.85em; }
.gls-subsection-title .gls-vi-line { font-family: 'IBM Plex Sans', sans-serif; font-size: 0.62em; margin-top: 3px; }
.gls-section-title .gls-vi-line { font-family: 'IBM Plex Sans', sans-serif; font-size: 0.55em; margin-top: 4px; color: var(--mid-green); }
.gls-section-desc .gls-vi-line { margin-top: 4px; }
.gls-callout-text .gls-vi-line { margin-top: 4px; }
.gls-btn .gls-vi-line, .gls-btn-ghost .gls-vi-line { font-size: 0.78em; opacity: 0.85; }
.gls-row-num .gls-vi-line { font-size: 0.85em; font-weight: 400; }
.gls-yesno button { line-height: 1.35; padding: 10px 8px; }
.gls-option { line-height: 1.35; }

@media (max-width: 820px) {
  .gls-rail { display: none; }
  .gls-topbar { display: block; }
  .gls-content { padding: 30px 18px 120px; }
  .gls-footer-nav { padding: 14px 18px; }
  .gls-welcome-grid { grid-template-columns: 1fr; }
}
